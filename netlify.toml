# https://docs.netlify.com/configure-builds/file-based-configuration/
# Monorepo: build only the Vite app from /frontend; publish = dist inside that base.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
